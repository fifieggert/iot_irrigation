# Orquestracao do projeto IoT Irrigation (R12).
#
# O banco e o broker MQTT sao externos (Supabase e HiveMQ), entao este compose
# sobe apenas os servicos proprios do projeto: o backend FastAPI e o painel web
# estatico. Configure back/.env antes de subir (copie de back/.env.example).

services:
  db:
    image: postgres:16-alpine
    container_name: iot-irrigation-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: irrigacao
    # Sem mapeamento de porta: o backend acessa via rede interna do compose.
    # Para abrir no DBeaver/pgAdmin do host, descomente usando 5433:
    # ports:
    #   - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d irrigacao"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    image: iot-irrigation-backend
    container_name: iot-irrigation-backend
    env_file:
      - ./back/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: nginx:1.27-alpine
    container_name: iot-irrigation-frontend
    depends_on:
      - backend
    ports:
      - "5500:80"
    restart: unless-stopped
    volumes:
      - ./front/index.html:/usr/share/nginx/html/index.html:ro
      - ./front/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./front/config.js:/usr/share/nginx/html/config.js:ro
      - ./front/dist:/usr/share/nginx/html/dist:ro

volumes:
  pgdata: